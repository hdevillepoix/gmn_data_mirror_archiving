# Config for the GMN Acacia <-> Banksia (Mediaflux) archive/restore scripts.
#
# Plain KEY=VALUE, sourced by bash. No spaces around '='.

# Acacia (rclone) side: buckets are ${ACACIA_REMOTE}:${ACACIA_BUCKET_PREFIX}<year>,
# each holding one directory per station.
ACACIA_REMOTE=hdevillepoix
ACACIA_BUCKET_PREFIX=gmn-archives-

# Banksia (Mediaflux) side: tars land in ${MF_ROOT}/<year>/ as
# ${ACACIA_BUCKET_PREFIX}<year>_<station>.tar (+ .sha256).
MF_ROOT=/projects/DFN/GMN

# SLURM. pawsey0961 is the storage project; SLURM_ACCOUNT must be a compute
# allocation (TODO: confirm - pawsey0851 is what the DFN pipeline uses).
SLURM_PARTITION=copy
SLURM_ACCOUNT=pawsey0851
SLURM_WALLTIME_ARCHIVE=06:00:00
# Restores can wait on tape recall.
SLURM_WALLTIME_RESTORE=24:00:00
SLURM_MEM=8G
# Largest --array size submitted at once. Keep <= the cluster's MaxArraySize.
SLURM_ARRAY_MAX=1000
# This user's MaxSubmitJobs on SLURM_ACCOUNT/SLURM_PARTITION (every array
# task counts). Only one batch is queued at a time, sized to fit under this
# alongside the jobs already queued; a continuation job submits the next
# batch once it finishes. Find the real limit with:
#   sacctmgr -n show assoc user=$USER format=account,partition,qos,maxsubmit
#   sacctmgr -n show qos format=name,maxsubmitpu
SLURM_SUBMIT_MAX=100

# Scratch bounding. Each job stages one whole year-station (one tar, no
# splitting): ~1x the station size when archiving (tar --remove-files),
# ~2x when restoring (tar + extracted copy). At most MAX_PARALLEL jobs run at
# once, so peak scratch is roughly the MAX_PARALLEL biggest stations (x2 for
# restore). Submitters refuse to run above SCRATCH_BUDGET_BYTES (2 TiB).
MAX_PARALLEL=4
SCRATCH_BUDGET_BYTES=2199023255552
# Environment variable (name, not value) holding the scratch root.
SCRATCH_ROOT_ENV=MYSCRATCH

# rclone
RCLONE_TRANSFERS=8
RCLONE_CHECKERS=8
# Also the --cpus-per-task of each array task (the srun step can't exceed it).
RCLONE_CPUS=4

# pshell is provided via the module system on Setonix.
PSHELL_MODULE=pshell/1.2.1
# Set to TRUE for `pshell -v 2` on put/get scripts.
PSHELL_VERBOSE=FALSE

# Durable state (ledgers, lists, logs). Must NOT be on /scratch (purged).
# Literal absolute path - no ~ or $HOME.
STATE_DIR=/software/projects/pawsey0851/hdevillepoix/gmn_banksia/state

# Submitters stay in the foreground (run them in tmux) and watch their jobs,
# printing progress/failures; this is the poll interval in seconds.
WATCH_INTERVAL=30
# How often (seconds) to also print a status summary when nothing changed.
WATCH_HEARTBEAT=600
